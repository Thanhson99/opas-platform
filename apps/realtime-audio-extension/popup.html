<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPAS Audio</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #11151c;
      color: #f3f5f7;
    }
    * { box-sizing: border-box; }
    body { width: 300px; margin: 0; background: #11151c; }
    main { display: grid; gap: 10px; padding: 12px; }
    h1 { margin: 0; font-size: 15px; line-height: 1.2; }
    button {
      min-height: 36px;
      border: 1px solid #364153;
      border-radius: 6px;
      background: #1d2633;
      color: #f8fafc;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      padding: 0 12px;
    }
    button.primary { border-color: #0f766e; background: #0f766e; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .status { color: #a8b3c2; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>OPAS Realtime Audio</h1>
    <button id="openWebButton" class="primary" type="button">Open Web</button>
    <button id="refreshBridgeButton" type="button">Refresh</button>
    <div id="status" class="status">Bridge v0.1.1. Open the web screen to connect and translate.</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
