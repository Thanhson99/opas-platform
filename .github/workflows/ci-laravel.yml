name: CI - Laravel App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  laravel-tests:
    name: Laravel CI Pipeline
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports: [3306:3306]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, mysql
          tools: composer:v2

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./apps/laravel/package-lock.json

      - name: ♻️ Cache Node Modules
        uses: actions/cache@v3
        with:
          path: ./apps/laravel/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./apps/laravel/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 📦 Install PHP dependencies
        working-directory: ./apps/laravel
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: 📦 Install NPM dependencies
        working-directory: ./apps/laravel
        run: npm ci

      - name: 🛠 Copy .env
        working-directory: ./apps/laravel
        run: cp .env.example .env

      - name: 🔐 Generate app key
        working-directory: ./apps/laravel
        run: php artisan key:generate

      - name: 🧱 Run migrations
        working-directory: ./apps/laravel
        run: php artisan migrate --force

      - name: 🧪 Run PHP checks
        working-directory: ./apps/laravel
        run: composer check

      - name: ⚛️ Run React checks + production build
        working-directory: ./apps/laravel
        run: npm run ci
