name: CI - N8N Workflows

on:
  push:
    paths:
      - 'services/n8n/**'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'services/n8n/**'
      - 'docker-compose.yml'

jobs:
  n8n-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate N8N workflow JSON
        run: |
          echo "✅ Validating N8N workflow files..."
          if [ -d "services/n8n/workflows" ] && find services/n8n/workflows -maxdepth 1 -name '*.json' | grep -q .; then
            for file in services/n8n/workflows/*.json; do
              jq empty "$file" || { echo "❌ Invalid JSON: $file"; exit 1; }
            done
            echo "🎉 All workflows are valid!"
          else
            echo "ℹ️ No workflow JSON files found, skipping validation."
          fi

      - name: Check if docker-compose.yml exists
        run: |
          test -f docker-compose.yml && echo "✅ Docker Compose found." || exit 1
