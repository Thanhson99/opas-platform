services:
  # Laravel PHP Application
  laravel:
    build:
      context: ./apps/laravel
      dockerfile: Dockerfile
    container_name: laravel-app
    volumes:
      - ./apps/laravel:/var/www
      - ./:/workspace/repo
    depends_on:
      - postgres
      - postgres-testing
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: ${LARAVEL_DB_HOST:-postgres}
      DB_PORT: ${LARAVEL_DB_PORT:-5432}
      DB_DATABASE: ${LARAVEL_DB_DATABASE:-laravel}
      DB_USERNAME: ${LARAVEL_DB_USERNAME:-root}
      DB_PASSWORD: ${LARAVEL_DB_PASSWORD}
    networks:
      - backend

  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laravel}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_PATH:-./docker/postgres/data}:/var/lib/postgresql/data
    networks:
      - backend

  # PostgreSQL Database dedicated to PHPUnit only.
  postgres-testing:
    image: postgres:15
    container_name: postgres-testing
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-laravel_testing}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-change-me}
    volumes:
      - ${POSTGRES_TEST_DATA_PATH:-./docker/postgres-testing/data}:/var/lib/postgresql/data
    networks:
      - backend

  # Python microservices (FastAPI / Flask)
  python-services:
    profiles:
      - automation
    build:
      context: ./services/python
      dockerfile: Dockerfile
    container_name: python-services
    volumes:
      - ./services/python:/app
    networks:
      - backend

  # n8n Automation Tool
  n8n:
    profiles:
      - automation
    image: n8nio/n8n:latest
    container_name: n8n
    cpus: "1.00"
    mem_limit: 768m
    ports:
      - "5678:5678"
    volumes:
      - ./services/n8n:/home/node/.n8n
      - ./videos:/data/videos
      - ./videos_uploaded:/data/videos_uploaded
    env_file:
      - ./services/n8n/.env
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
    depends_on:
      - ollama
    networks:
      - backend
      - shared_net

  # Ollama (Local LLM runtime)
  # We will run two models inside this ONE container:
  # - qwen2.5:7b  (writer)
  # - mistral:7b  (critic/editor)
  #
  # In n8n, call: http://ollama:11434/api/chat
  # and set "model" to either "qwen2.5:7b" or "mistral:7b"
  ollama:
    profiles:
      - automation
    image: ollama/ollama:latest
    container_name: ollama
    cpus: "2.00"
    mem_limit: 3g
    ports:
      - "11434:11434"
    volumes:
      - ./docker/ollama:/root/.ollama
    networks:
      - backend

  # LibreTranslate - Translation API
  libretranslate:
    profiles:
      - automation
    build:
      context: ./services/libretranslate
      dockerfile: Dockerfile
    container_name: libretranslate
    cpus: "1.00"
    mem_limit: 1g
    ports:
      - "5001:5000"
    networks:
      - backend

  # Nginx Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8881:8881"  # Laravel
      # - "8882:8882"  # n8n (uncomment if exposed)
      - "8884:8884"  # LibreTranslate
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./apps/laravel:/var/www
    depends_on:
      - laravel
    networks:
      - backend

networks:
  backend:
    driver: bridge
  shared_net:
    external: true
    name: ${SHARED_NET_NAME:-shared_net}
